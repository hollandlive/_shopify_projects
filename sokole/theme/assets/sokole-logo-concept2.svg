<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 112" role="img">
  <title>Sokole Fragrance — Concept 2: Pure Luxury Wordmark</title>

  <!--
    Concept 2: Minimal wordmark — no smoke, no ornament.
    Inspired by MFK, Initio, Maison Margiela fragrance branding.
    Clean hierarchy: large name / rule / small house descriptor.
    Works as favicon (just the S), letterhead, embossing, and digital.
  -->

  <defs>
    <linearGradient id="c2Gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#DCAD4E"/>
      <stop offset="50%"  stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#A67828"/>
    </linearGradient>
  </defs>

  <!-- SOKOLE — wide-spaced light serif -->
  <text x="200" y="68"
        font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
        font-size="60"
        font-weight="300"
        letter-spacing="20"
        text-anchor="middle"
        fill="url(#c2Gold)">SOKOLE</text>

  <!-- Thin rule — the pause between name and descriptor -->
  <line x1="80" y1="79" x2="320" y2="79"
        stroke="url(#c2Gold)" stroke-width="0.65" stroke-opacity="0.7"/>

  <!-- FRAGRANCES — small caps, very wide tracking -->
  <text x="200" y="101"
        font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
        font-size="13"
        font-weight="400"
        letter-spacing="12"
        text-anchor="middle"
        fill="url(#c2Gold)">FRAGRANCES</text>

</svg>
