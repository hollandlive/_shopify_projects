<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Sokole Fragrance</title>
  <desc>Sokole Fragrance logo with golden smoke wisps on transparent background</desc>

  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E8C46A"/>
      <stop offset="45%"  stop-color="#F5DFA0"/>
      <stop offset="100%" stop-color="#C8952E"/>
    </linearGradient>
    <linearGradient id="smokeG1" x1="0%" y1="100%" x2="20%" y2="0%">
      <stop offset="0%"   stop-color="#B8832A" stop-opacity="0.7"/>
      <stop offset="40%"  stop-color="#D4A84B"/>
      <stop offset="70%"  stop-color="#EDD07A"/>
      <stop offset="100%" stop-color="#C8952E" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="smokeG2" x1="0%" y1="100%" x2="15%" y2="0%">
      <stop offset="0%"   stop-color="#C8952E" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#EDD07A"/>
      <stop offset="100%" stop-color="#B8832A" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="smokeG3" x1="0%" y1="100%" x2="10%" y2="0%">
      <stop offset="0%"   stop-color="#C8952E" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#A07028" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Wisp 1 - leftmost, S-curves leftward rising up -->
  <path d="M 72,160
             C 66,142  58,128  64,108
             C 70,88   82,80   76,60
             C 70,42   60,32   64,16"
        fill="none"
        stroke="url(#smokeG1)"
        stroke-width="2.8"
        stroke-linecap="round"/>

  <!-- Wisp 2 - middle -->
  <path d="M 85,160
             C 92,140  78,124  85,104
             C 92,84   104,74  97,54
             C 90,36   82,26   85,12"
        fill="none"
        stroke="url(#smokeG2)"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <!-- Wisp 3 - rightmost, thinnest, curves close to text edge -->
  <path d="M 97,160
             C 104,142  93,128  99,110
             C 105,92   114,82  108,64
             C 102,48   96,38   98,22"
        fill="none"
        stroke="url(#smokeG3)"
        stroke-width="1.4"
        stroke-linecap="round"/>

  <!-- Horizontal rule below wisps -->
  <line x1="60" y1="165" x2="107" y2="165"
        stroke="#C8952E" stroke-width="0.7" stroke-opacity="0.75"/>

  <!-- SOKOLE main text -->
  <text x="111" y="140"
        font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
        font-size="90"
        font-weight="300"
        letter-spacing="2"
        fill="url(#goldText)">SOKOLE</text>

  <!-- Subtle bright sheen overlay -->
  <text x="111" y="140"
        font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
        font-size="90"
        font-weight="300"
        letter-spacing="2"
        fill="#FFFBE8"
        fill-opacity="0.15">SOKOLE</text>

  <!-- FRAGRANCE subtitle -->
  <text x="178" y="167"
        font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
        font-size="16.5"
        font-weight="400"
        letter-spacing="9"
        fill="url(#goldText)">FRAGRANCE</text>

</svg>
